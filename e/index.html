<style>

html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
form { width: min(360px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 12px; }

p { margin: 0; color: var(--muted); font-size: 14px; }
input { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: inherit; padding: 0 12px; }
input:focus { outline: 2px solid #5b7cff; outline-offset: 1px; }
button { height: 44px; border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-fg); font: 600 15px system-ui, sans-serif; cursor: pointer; }
#e { color: var(--bad); min-height: 1.5em; }
[hidden] { display: none !important; }
