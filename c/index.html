<style>

p { margin: 0; color: var(--muted); font-size: 14px; }

button { height: 44px; border: 0; border-radius: 10px; background: var(--btn); color: var(--btn-fg); font: 600 15px system-ui, sans-serif; cursor: pointer; }

[hidden] { display: none !important; }

    try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {}
    show(html);
  } catch (e) { err.textContent = 'Väärä salasana. Tarkista kirjoitusasu ja yritä uudelleen.'; }
});
})();
