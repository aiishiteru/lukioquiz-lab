const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const loaded = new Promise(r => document.readyState === 'complete' ? r() : addEventListener('load', () => r(), { once: true }));
const show = async html => { await loaded; await new Promise(r => setTimeout(r, 0)); document.open(); document.write(html); document.close(); };
async function dec(raw) {
  const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, k, b64(D.ct)));
}
async function derive(pw) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' }, k, 256));
}
const KEY = 'lab-key-' + D.salt;
/* GitHub Pages lets browsers cache pages for 10 min. Ask for the (uncached) version file; if a newer build
   exists, refetch this page past the cache and reload once. */
async function fresh() {
  try {
    const v = (await (await fetch(D.vurl + '?t=' + Date.now(), { cache: 'no-store' })).text()).trim();
    if (!v || v === D.ver) return true;
    const flag = 'lab-reload-' + v;
    try { if (sessionStorage.getItem(flag)) return true; sessionStorage.setItem(flag, '1'); } catch (e) { return true; }
    await fetch(location.href, { cache: 'reload' }); location.reload(); return false;
  } catch (e) { return true; }
}

  if (!(await fresh())) return;
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}

})();
document.getElementById('f').addEventListener('submit', async ev => {

  try {
    const raw = await derive(document.getElementById('p').value);
    const html = await dec(raw);
    try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {}
